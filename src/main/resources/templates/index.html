<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso - SIGEBOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>
<div class="acesso">
  <!-- Lado esquerdo: identificação do sistema. -->
  <section class="acesso-painel">
    <div class="marca">
      <img th:src="@{/logo.png}" alt="Logotipo do SIGEBOM">
      <div>
        <strong>SIGEBOM</strong>
        <span>Sistema de gestão para bombeiros</span>
      </div>
    </div>
    <p class="rodape">Uso restrito ao efetivo da corporação. Acessos são registrados.</p>
  </section>

  <!-- Lado direito: formulário de login. -->
  <section class="acesso-form">
    <form th:action="@{/login}" method="post">
      <h2>Entrar no sistema</h2>
      
      <!-- Div que aparece automaticamente apenas se o login falhar -->
      <div class="aviso aviso-erro" th:if="${param.error}">
        Credenciais não conferem. Verifique os dados e tente novamente.
      </div>
      
      <!-- Div que aparece caso o usuário tenha redefinido a senha -->
      <div class="aviso aviso-ok" th:if="${param.recuperacaoEnviada}">
        Se o identificador existir, um e-mail com instruções foi enviado.
      </div>
      
      <div class="campo">
        <label for="username">E-mail ou CPF</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      
      <div class="campo">
        <label for="password">Senha</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" required style="padding-right: 70px; width: 100%;">
          
          <!-- Botão para visualizar/ocultar a senha -->
          <button type="button" id="btn-toggle-senha" onclick="toggleSenha()" 
                  style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); 
                         background: transparent; border: none; font-size: 13px; color: var(--aco); 
                         font-weight: 500; cursor: pointer; padding: 4px;">
            Mostrar
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn btn-acao">Entrar</button>
      
      <!-- Botão de Esqueci minha senha -->
      <a th:href="@{/esqueci-senha}" class="btn btn-vazio" style="width: 100%; margin-top: 12px; text-align: center;">
        Esqueci minha senha
      </a>
    </form>
  </section>
</div>

<!-- Script para alternar a visualização da senha -->
<script>
  function toggleSenha() {
    const inputSenha = document.getElementById('password');
    const btnToggle = document.getElementById('btn-toggle-senha');
    
    if (inputSenha.type === 'password') {
      inputSenha.type = 'text';
      btnToggle.textContent = 'Ocultar';
    } else {
      inputSenha.type = 'password';
      btnToggle.textContent = 'Mostrar';
    }
  }
</script>
</body>
</html>
